<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>GitHub 趋势日报 · 往期目录</title><style>:root{--bg:#ffffff;--bg2:#f6f8fa;--fg:#1f2328;--fg2:#59636e;--fg3:#818b98;--bd:#d1d9e0;--bd2:#e4e8ec;--ac:#0969da;--acbg:#ddf4ff;--warn:#9a6700;--warnbg:#fff8c5;--g1:#57606a;--g2:#8c959f;--g3:#afb8c1;--g4:#d0d7de}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

.ins{list-style:none;margin:0;padding:0;counter-reset:i}.ins li{counter-increment:i;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd2);font-size:13px;line-height:20px}.ins li:last-child{border:0}
.ins li:before{content:counter(i);font:12px/20px var(--mono);color:var(--fg2);width:20px;height:20px;text-align:center;border:1px solid var(--bd);border-radius:50%}
.ins b.h{display:block;font-weight:600;color:var(--fg)}.ins p{margin:4px 0 0;color:var(--fg2);font-size:12px;line-height:18px}
.wl li{display:block;padding:12px 16px;border-bottom:1px solid var(--bd2);font-size:12px;line-height:18px;color:var(--fg2)}.wl li:last-child{border:0}.wl a{display:block;font:13px/20px var(--mono);color:var(--ac);margin-bottom:4px}
.foot{border-top:1px solid var(--bd);padding:16px 0 32px;font-size:12px;color:var(--fg3)}.foot .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.foot a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
